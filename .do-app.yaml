name: smart-farmer-backend
region: nyc

services:
  - name: backend
    # Source configuration
    source_dir: backend
    
    # Build configuration
    build_command: pip install --upgrade pip && pip install -r requirements.txt
    
    # Run configuration - Using python -m to ensure proper module loading
    run_command: python -m uvicorn main:app --host 0.0.0.0 --port 8080
    
    # Environment
    environment_slug: python
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # HTTP configuration
    http_port: 8080
    
    # Health check
    health_check:
      http_path: /
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 5
    
    # Environment variables
    envs:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
