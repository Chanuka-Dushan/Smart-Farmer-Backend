# Digital Ocean App Platform Configuration
name: smart-farmer-backend
region: nyc

services:
  - name: backend
    github:
      branch: main
      deploy_on_push: true
      repo: Chanuka-Dushan/Smart-Farmer-Backend
    
    source_dir: /
    dockerfile_path: Dockerfile
    
    # Use buildpack cache (speeds up builds)
    build_command: ""
    
    # Environment variables
    envs:
      - key: PORT
        value: "8080"
      - key: PYTHONUNBUFFERED
        value: "1"
    
    # Resource configuration
    instance_count: 1
    instance_size_slug: professional-xs  # Or basic-xxs for cheaper
    
    http_port: 8080
    
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3

# Database (if using DigitalOcean managed database)
databases:
  - name: db
    engine: PG
    production: true
