name: smart-farmer-backend
region: nyc

services:
  - name: backend
    source_dir: backend
    github:
      branch: main
      deploy_on_push: true
      repo: Chanuka-Dushan/Smart-Farmer-Backend
    
    # Build configuration
    build_command: pip install -r requirements.txt
    
    # Run command - this is the critical part
    run_command: gunicorn -w 4 -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:8080
    
    # Environment
    environment_slug: python
    
    # Instance configuration
    instance_count: 1
    instance_size_slug: basic-xxs
    
    # HTTP port
    http_port: 8080
    
    # Health check
    health_check:
      http_path: /
    
    # Environment variables (add your own as needed)
    envs:
      - key: PORT
        value: "8080"
